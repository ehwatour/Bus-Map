<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="utf-8">

    <title>노선 지도</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <meta name="referrer" content="no-referrer" />

    <!-- ======================================
         Leaflet CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- ======================================
         사용자 CSS
    ====================================== -->

    <link rel="stylesheet" href="style.css">


    <!-- ★ 1. 네비게이션 CSS 연결 -->
    <link rel="stylesheet" href="navigation.css">

</head>

<body>


    <!-- ======================================
         패널 열기 / 닫기 버튼
    ====================================== -->

<button
        id="panel-toggle"
        type="button"
        aria-label="노선 선택 패널 열기/닫기"
    aria-expanded="true"
    ></button>


    <!-- ======================================
         지도
    ====================================== -->

    <div id="map"></div>


    <!-- ======================================
         노선 선택 패널
    ====================================== -->

    <div id="control-panel">


        <!-- ==================================
             제목
        ================================== -->

        <h2>노선 선택</h2>


        <!-- ==================================
             상단 고정 영역
        ================================== -->

        <div class="fixed-top">


            <!-- ==================================
                 전체 선택 / 전체 해제
            ================================== -->

            <div class="buttons">

                <button id="checkAll" type="button">
                    전체 선택
                </button>

                <button id="uncheckAll" type="button">
                    전체 해제
                </button>

            </div>


            <!-- ==================================
                 검색
            ================================== -->

            <div class="search-box">

                <input
                    id="route-search"
                    type="text"
                    placeholder="노선 검색"
                    autocomplete="off"
                    aria-label="노선 검색어 입력"
                >

                <button id="search-btn" type="button">
                    검색
                </button>


                <!-- 검색 결과 전체 ON/OFF -->

                <label
                    class="search-check-label"
                    title="검색된 노선 전체 선택/해제"
                >

                    <input id="search-check" type="checkbox" checked>

                </label>

            </div>

<hr>

        </div>


        <!-- ==================================
             노선 목록 스크롤 영역
        ================================== -->

<div class="panel-content">

    <div id="route-list"></div>

</div>

    </div>


    <!-- ======================================
         Leaflet JS
    ====================================== -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- ======================================
         GeoJSON
         script.js보다 먼저 로드
    ====================================== -->

    <script src="RouteAndStop.js"></script>


    <!-- ======================================
         지도 / 노선 제어
    ====================================== -->

    <script src="script.js"></script>


    <!-- ★ 2. 네비게이션 JS 연결 (맨 밑) -->
    <script src="navigation.js"></script>

</body>

</html>
